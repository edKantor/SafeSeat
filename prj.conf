CONFIG_PRINTK=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y

# Selects CONFIG_I2C automatically once the devicetree node is present
# (see boards/xiao_ble_nrf52840_sense.overlay).
CONFIG_FUEL_GAUGE=y

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="SafeSeat"

# NOT CONFIG_LOG: on this board, CONFIG_LOG_MODE_IMMEDIATE (synchronous log
# output) hung boot entirely once combined with bt_enable() -- confirmed by
# bisection, isolated from Bluetooth itself (bt_enable() alone works fine).
# Plain printk avoids the same conflict with BT's timing-critical code.
