CONFIG_PRINTK=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y

# Selects CONFIG_I2C automatically once the devicetree node is present
# (see boards/xiao_ble_nrf52840_sense.overlay).
CONFIG_FUEL_GAUGE=y

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="SafeSeat"

# Maximum debug visibility: debug-level logging everywhere by default
# (our own code, BT host/controller, GPIO, I2C, fuel gauge, ...), printed
# synchronously so nothing is lost to a full ring buffer before a crash.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_MODE_IMMEDIATE=y
